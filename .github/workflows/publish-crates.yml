# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to crates.io in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/turbopuffer/turbopuffer-rust/actions/workflows/publish-crates.yml
#
# Authenticates with crates.io trusted publishing, so there's no registry token
# secret. The crate's trusted publisher on crates.io must name this workflow's
# filename, `publish-crates.yml`.
name: Publish crates.io
on:
  workflow_dispatch:

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
