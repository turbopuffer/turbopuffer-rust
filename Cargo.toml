[package]
name = "turbopuffer"
version = "0.1.0-beta.2"
edition = "2024"
rust-version = "1.85"
description = "The official Rust library for the turbopuffer API"
license = "MIT"
repository = "https://github.com/turbopuffer/turbopuffer-rust"
homepage = "https://turbopuffer.com/docs/api-overview"
documentation = "https://docs.rs/turbopuffer"
readme = "README.md"
exclude = ["/.github", "/scripts", "/release-please-config.json", "/.release-please-manifest.json", "/.stats.yml"]
categories = ["api-bindings", "web-programming::http-client"]
keywords = ["turbopuffer", "api", "sdk"]

[features]
default = ["rustls"]
## Use rustls for TLS.
rustls = ["reqwest/rustls"]
## Use the platform's native TLS implementation.
native-tls = ["reqwest/native-tls"]

[dependencies]
bytes = "1"
flate2 = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
hyper-util = { version = "0.1.12", default-features = false, features = ["client-legacy", "tokio"] }
jiff = { version = "0.2", default-features = false, features = ["serde", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "gzip", "http2", "system-proxy"] }
serde = { version = "1.0.181", features = ["derive"] }
serde_json = "1.0.118"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
tower-layer = "0.3"
tower-service = "0.3"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
